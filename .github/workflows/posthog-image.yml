name: PostHog Image

# Builds the PostHog fork image. Pushes to the posthog branch publish
# ghcr.io/posthog/mcp-grafana:<version>, which the charts repo pins by digest.
# Pull requests only build amd64 to check the Dockerfile.
on:
  push:
    branches: [posthog]
  pull_request:
    branches: [posthog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posthog-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The fork has no release tags, so take them from upstream. The version
      # then reads like 2.2.0-7-g5656df5: the upstream base plus our commits.
      - name: Compute version
        id: version
        run: |
          git fetch --quiet --tags https://github.com/grafana/mcp-grafana.git
          version=$(git describe --tags --match 'v*' HEAD)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile cross-compiles, so arm64 needs no QEMU.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/posthog/mcp-grafana:${{ steps.version.outputs.version }}
            ghcr.io/posthog/mcp-grafana:posthog
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Pin in charts: \`sha: \"${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}\"\`" >> "$GITHUB_STEP_SUMMARY"
